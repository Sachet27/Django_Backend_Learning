{% extends 'main.html' %}

{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Room Page </title>
</head>
<body>
    <div class="content">
        {% if room is not None %}
        <h4> Room Number: {{room.id}} </h4>
        <h3> {{room.name}} </h3>
        <p> {{room.description}} </p>
        {% else %}
        <h3> Room doesn't exist</h3>
        {% endif %}

    </div>
    
</body>
</html>

{%endblock content%}
